<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול - Alpha Drive Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="logo transpernt.png" alt="Alpha Drive Logo">
    </div>
    <!-- Mobile menu toggle button -->
    <button class="menu-toggle" aria-label="תפריט">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">בית</a></li>
        <li><a href="buy.html">קנייה</a></li>
        <li><a href="sell.html">מכירה</a></li>
        <li><a href="valuation.html">בדיקת מחירון</a></li>
        <li><a href="signup.html">הצטרפות</a></li>
        <li class="active"><a href="admin.html">ניהול</a></li>
      </ul>
    </nav>
  </header>
  <section>
    <h2 class="section-title">ממשק ניהול</h2>
    <h3 style="color:#00a3e0;">קטגוריות</h3>
    <form id="addCategoryForm" style="max-width:500px; margin-bottom:1rem;">
      <label for="catName">שם קטגוריה</label>
      <input type="text" id="catName" name="catName" required>
      <label for="catDesc">תיאור</label>
      <input type="text" id="catDesc" name="catDesc">
      <button type="submit">הוסף קטגוריה</button>
    </form>
    <table>
      <thead>
        <tr>
          <th>שם</th>
          <th>תיאור</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="categoryTableBody"></tbody>
    </table>
    <h3 style="color:#00a3e0; margin-top:2rem;">מודעות</h3>
    <table>
      <thead>
        <tr>
          <th>כותרת</th>
          <th>קטגוריה</th>
          <th>מחיר</th>
          <th>סטטוס</th>
          <th>פעולות</th>
        </tr>
      </thead>
      <tbody id="listingTableBody"></tbody>
    </table>

    <h3 style="color:#00a3e0; margin-top:2rem;">הוסף מודעה (מנהל)</h3>
    <form id="adminSellForm" style="max-width:500px; margin-bottom:2rem;">
      <label for="adminCategory">קטגוריה</label>
      <select id="adminCategory" name="category" required></select>
      <label for="adminTitle">שם מוצר / יצרן</label>
      <input type="text" id="adminTitle" name="title" required>
      <label for="adminPrice">מחיר (לפני מע"מ)</label>
      <input type="number" id="adminPrice" name="price" min="0" required>
      <label for="adminContact">פרטי קשר</label>
      <input type="text" id="adminContact" name="contact" required>
      <label for="adminDesc">תיאור נוסף</label>
      <textarea id="adminDesc" name="description"></textarea>
      <label for="adminImage">תמונה (אופציונלי)</label>
      <input type="file" id="adminImage" name="image" accept="image/*">
      <button type="submit">הוסף מודעה</button>
    </form>
  </section>
  <footer>
    © 2025 Alpha Drive. כל הזכויות שמורות.
  </footer>
<script src="script.js"></script>
</body>
</html>
