<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פרסום מוצר חדש - Alpha Drive Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="logo transpernt.png" alt="Alpha Drive Logo">
    </div>
    <!-- Mobile menu toggle button -->
    <button class="menu-toggle" aria-label="תפריט">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">בית</a></li>
        <li><a href="buy.html">קנייה</a></li>
        <li class="active"><a href="sell.html">מכירה</a></li>
        <li><a href="valuation.html">בדיקת מחירון</a></li>
        <li><a href="signup.html">הצטרפות</a></li>
      </ul>
    </nav>
  </header>
  <section>
    <h2 class="section-title">פרסם מודעה</h2>
    <form id="sellForm">
      <label for="category">קטגוריה</label>
      <select id="category" name="category" required></select>
      <label for="title">שם מוצר / יצרן</label>
      <input type="text" id="title" name="title" placeholder="לדוגמה: מאזדה" required>
      <label for="model">דגם / תת דגם</label>
      <input type="text" id="model" name="model" placeholder="לדוגמה: 3">
      <!-- Vehicle specific fields -->
      <div class="vehicle-field" style="display:none;">
        <label for="year">שנת יצור</label>
        <input type="number" id="year" name="year" min="2000" max="2100">
      </div>
      <div class="vehicle-field" style="display:none;">
        <label for="mileage">ק"מ</label>
        <input type="number" id="mileage" name="mileage" min="0">
      </div>
      <div class="vehicle-field" style="display:none;">
        <label for="transmission">תיבת הילוכים</label>
        <select id="transmission" name="transmission">
          <option value="">בחר</option>
          <option value="אוטומט">אוטומט</option>
          <option value="ידני">ידני</option>
        </select>
      </div>
      <div class="vehicle-field" style="display:none;">
        <label for="dualControl">דוושות ואמצעי בטיחות</label>
        <input type="checkbox" id="dualControl" name="dualControl">
      </div>
      <div class="vehicle-field" style="display:none;">
        <label for="cameras">מצלמות</label>
        <select id="cameras" name="cameras">
          <option value="">בחר</option>
          <option value="ללא">ללא</option>
          <option value="קדמית">קדמית</option>
          <option value="אחורית">אחורית</option>
          <option value="קדמית ואחורית">קדמית ואחורית</option>
        </select>
      </div>
      <label for="price">מחיר (לפני מע"מ)</label>
      <input type="number" id="price" name="price" min="0" required>
      <small><a href="#" id="estimatePriceLink" style="color:#00a3e0;">בדוק מחיר משוער</a></small>
      <label for="phone">טלפון</label>
      <input type="tel" id="phone" name="phone" placeholder="050-1234567" pattern="[0-9\-\+\s]+" required>
      <label for="email">אימייל</label>
      <input type="email" id="email" name="email" placeholder="example@domain.com" required>
      <label for="description">תיאור נוסף</label>
      <textarea id="description" name="description" placeholder="פרט את מצב המוצר, תוספות ועוד"></textarea>
      <label for="image">תמונה (אופציונלי)</label>
      <input type="file" id="image" name="image" accept="image/*">
      <button type="submit">פרסם מודעה</button>
    </form>
  </section>
  <footer>
    © 2025 Alpha Drive. כל הזכויות שמורות.
  </footer>
  <script src="script.js"></script>
</body>
</html>
