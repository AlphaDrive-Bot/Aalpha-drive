<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת מחירון משוערת - Alpha Drive Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="logo transpernt.png" alt="Alpha Drive Logo">
    </div>
    <!-- Mobile menu toggle button -->
    <button class="menu-toggle" aria-label="תפריט">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">בית</a></li>
        <li><a href="buy.html">קנייה</a></li>
        <li><a href="sell.html">מכירה</a></li>
        <li class="active"><a href="valuation.html">בדיקת מחירון</a></li>
        <li><a href="signup.html">הצטרפות</a></li>
      </ul>
    </nav>
  </header>
  <section>
    <h2 class="section-title">בדיקת מחירון משוערת</h2>
    <p style="text-align:center; max-width:800px; margin:auto; color:#cbd5e1;">בדקו את ערך הרכב המשוער לפי נתוני מחירון. הזינו יצרן, דגם, שנת יצור וק"מ או מספר רכב. החישוב הינו להדגמה בלבד ואינו מחליף בדיקה מקצועית.</p>
    <form id="valuationForm">
      <label for="make">יצרן</label>
      <input type="text" id="make" name="make" placeholder="לדוגמה: מאזדה" required>
      <label for="model">דגם</label>
      <input type="text" id="model" name="model" placeholder="לדוגמה: 3" required>
      <label for="year">שנת יצור</label>
      <input type="number" id="year" name="year" min="2000" max="2100" required>
      <label for="mileage">ק"מ</label>
      <input type="number" id="mileage" name="mileage" min="0" required>
      <label for="license">מספר רכב (אופציונלי)</label>
      <input type="text" id="license" name="license">
      <button type="submit">חשב מחיר משוער</button>
    </form>
    <p id="valuationResult" style="text-align:center; font-weight:bold; margin-top:1rem; color:#00a3e0;"></p>
  </section>
  <footer>
    © 2025 Alpha Drive. כל הזכויות שמורות.
  </footer>
  <script src="script.js"></script>
</body>
</html>
